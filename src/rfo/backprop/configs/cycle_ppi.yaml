# Default Protenix-backed gradient optimizer used by the cycling driver.
algorithm: gradient_mcmc
algorithm_config:
  mutate_each: 1
  random_mut: false
  opt_steps:
    total_steps: 5
    T_init: 1.0
    half_life: 40
  save_accept: false

protenix_model: ${oc.env:OFOLDX_PROTENIX_MODEL,oteam/protenix}
n_recycles: 10
num_steps: 50
lr: 0.01
max_mut: 5
n_cycles: 1
enable_semigreedy: true
optimize_binder: true
interface_only: false
self_template: false
loss_type: pae_interface_mean
